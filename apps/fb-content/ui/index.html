<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content MXH</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../../../hub/assets/tool.css">
<style>
/* Laid out like Product Review's window: the product list with Thao tác beside it, the run row, then the results of the
   chosen product (its images and a post to copy) where Product Review shows its progress. Fits the window. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto auto minmax(0, 1fr); }
.tools-row { display: flex; gap: 12px; margin-bottom: 10px; }
#rows { height: 224px; padding: 10px 10px 6px; }
/* One row per product, as in Product Review: #, name, status, thumbnail, Xem / sửa, ×. */
.qrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 44px 96px 34px; gap: 8px; align-items: center; height: 60px; padding: 0 8px 0 10px; margin-bottom: 4px; background: #fff; border: 1px solid var(--line); cursor: pointer; }
.qrow:hover { background: var(--hover); }
.qrow[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.qrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .thumb { width: 44px; height: 44px; background: var(--control); object-fit: cover; display: block; }
.qrow .btn { height: 34px; padding: 0; }
.ok { color: #006400; } .warn { color: rgb(176, 96, 0); }
.pair2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair2 label { margin: 0 0 8px; }
dialog .pair > div > input + label { margin-top: 12px; }
.wm-preview { position: relative; margin-top: 8px; width: 100%; background: linear-gradient(135deg, #dcd5c8, #b7ab97); border: 1px solid var(--line); overflow: hidden; }
.wm-preview .bg { display: block; width: 100%; height: 100%; object-fit: fill; }
.wm-preview img.mark { position: absolute; max-width: none; }
.wm-preview.plate { cursor: pointer; }
.wm-preview.off img.mark { opacity: .35; }
.wm-preview.plate { background: #eceae4; }
.wm-preview.none { display: grid; place-content: center; height: 64px; background: #fff; border-style: dashed; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
.check[hidden] { display: none; }
.check { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; cursor: pointer; }
.check input { width: auto; margin: 0; }
.actions-col { padding-top: 10px; }
.tile.waiting.warn { border-color: rgb(176, 96, 0); }
.empty-note.warn { white-space: pre-line; text-align: left; max-height: 90px; overflow: auto; }
.empty-list { height: 100%; display: grid; place-content: center; color: var(--muted); }
/* Đăng lên: the platforms to write for, each with its logo; at least one stays on. */
.platforms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.platforms button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 4px; font: inherit; font-size: 12.5px; color: var(--ink); background: #fff; border: 1px solid var(--line); cursor: pointer; }
.platforms button:hover { background: var(--hover); }
.platforms button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.platforms button[aria-pressed="false"] svg { filter: grayscale(1); opacity: .5; }
.logo { width: 16px; height: 16px; flex: none; display: block; }
#tones { display: flex; }
#tones button { flex: 1; padding: 0 8px; }
/* One post per chosen platform: a tab each, the post, then its length and what suits that platform. */
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.post-head .seg button { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; }
.post-head .btn { margin-left: auto; }
.post-tip { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.post-tip .over { color: #b00020; }
#note { min-height: 72px; max-height: 120px; }
.run { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.run .btn { height: 40px; }
#btnRun { width: 160px; } #btnStop { width: 100px; }
#status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#logGroup { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
#logGroup h2 { margin: 0; }
#progress { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#log { height: 96px; min-height: 96px; max-height: 96px; resize: none; font-size: 12px; line-height: 1.5; background: #fff; }
/* Same look as Product Review: a green bar filled by the shots done (sliding while none is done yet), greyed controls while running. */
.progress { background: #e6e6e6; border: 1px solid #bcbcbc; height: 8px; overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: #06b025; transition: width .4s; }
.progress.marquee > span { width: 22%; transition: none; animation: marquee 2.2s linear infinite; }
@keyframes marquee { from { transform: translateX(-100%); } to { transform: translateX(460%); } }
.btn:disabled, .btn.primary:disabled { background: #cccccc; border-color: #bfbfbf; color: #838383; cursor: default; }
select:disabled, input:disabled, textarea:disabled { background-color: #cccccc; border-color: #bfbfbf; color: #838383; }
.qrow .btn:disabled { opacity: 1; }
/* Results of the chosen product: its images on the left, the post on the right. */
#resultGroup { grid-column: 1 / -1; display: flex; flex-direction: column; min-height: 0; }
#result { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; min-height: 0; }
#result .side { display: flex; flex-direction: column; min-height: 0; }
#result .side > label { margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; height: 32px; }
#out { flex: 1; min-height: 0; max-height: none; margin: 0; }
.tiles { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; overflow-y: auto; min-height: 0; flex: 1; }
.tile { position: relative; flex: none; width: 112px; height: 112px; background: #fff; border: 1px solid var(--line); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; font-size: 13px; }
.tile.add { display: grid; place-content: center; text-align: center; gap: 4px; border-style: dashed; color: var(--muted); font: inherit; cursor: pointer; }
.tile.add:hover, .tiles.dropping .tile.add { background: var(--hover); border-color: var(--accent); }
.tile.add b { font-size: 26px; font-weight: 300; line-height: 1; }
.tile.waiting { display: grid; place-content: center; text-align: center; border-style: dashed; color: var(--muted); padding: 8px; font-size: 12px; }
/* Each original image gives several bối cảnh: in the dialog a count under each image, in the results one row per
   original (the original, then its bối cảnh). */
.src { display: flex; flex-direction: column; gap: 4px; flex: none; }
.src .count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.src .count input { width: 52px; height: 24px; padding: 0 4px; }
.group-row { display: flex; gap: 10px; align-items: center; width: 100%; }
.group-row .tile.origin { border-color: #000; }
.group-row .arrow { color: var(--muted); }
#results { flex-direction: column; flex-wrap: nowrap; }
#results .tile { width: 84px; height: 84px; font-size: 11px; }
#results .group-row { gap: 8px; }
.empty-note { flex: 1; display: grid; place-content: center; text-align: center; background: #fff; border: 1px dashed var(--line); color: var(--muted); padding: 12px; }
/* Xem / sửa: the product's details and original images, like Product Review's product dialog. */
dialog { width: 760px; max-width: calc(100vw - 40px); padding: 0; border: 1px solid #7a7a7a; background: var(--control); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .25); }
dialog .bar { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 4px 0 12px; background: #fff; border-bottom: 1px solid var(--line); }
dialog .bar button { width: 32px; height: 28px; border: 0; background: none; font-size: 16px; }
dialog .body { padding: 14px 16px 16px; }
dialog .pair { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
dialog .pair label { margin-top: 0; }
dialog textarea { min-height: 72px; max-height: 120px; }
#tags { min-height: 96px; }
dialog .tiles { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; align-items: flex-start; }
dialog .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
dialog .foot .btn { width: 104px; }
#imgDlg { width: 760px; }
#imgDlg.compare { width: min(1180px, calc(100vw - 40px)); }
#imgGrid { display: flex; gap: 12px; justify-content: center; align-items: flex-start; }
#imgGrid figure { flex: 1; min-width: 0; margin: 0; text-align: center; }
#imgGrid img { display: block; max-width: 100%; max-height: 64vh; margin: 0 auto; object-fit: contain; background: #fff; border: 1px solid var(--line); }
#imgGrid figcaption { margin-top: 6px; font-size: 12px; color: var(--muted); }
#imgGrid figure.result figcaption { color: var(--text, #222); font-weight: 600; }
#brandOther { margin-top: 6px; }
.colors { max-height: 300px; min-height: 120px; overflow-y: auto; background: #fff; border: 1px solid var(--line); }
.crow { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); }
.crow[aria-current="true"] { background: var(--hover); }
.crow .arrow { flex: none; height: 56px; line-height: 56px; color: var(--muted); }
.crow .scenes { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 0; align-items: flex-start; }
.crow .hint { align-self: center; font-size: 12px; color: var(--muted); }
.crow-add { display: flex; align-items: center; gap: 8px; padding: 8px; }
.pt { display: flex; align-items: flex-start; gap: 4px; flex: none; }
.pt .th { position: relative; width: 56px; height: 56px; background: var(--control); border: 1px solid var(--line); cursor: zoom-in; }
.pt .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pt .th .remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; padding: 0; font-size: 11px; line-height: 1; }
.pt .chip { width: 56px; height: 56px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 1.2; }
.pt .chip small { font-size: inherit; line-height: inherit; color: inherit; }
.addtile { flex: none; width: 56px; height: 56px; padding: 0; font: inherit; font-size: 12px; color: var(--muted); background: #fff; border: 1px dashed var(--line); cursor: pointer; }
.addtile:hover { background: var(--hover); border-color: var(--accent); }
.result-color { margin: 4px 0 0; }
.angles-btn { height: 26px; padding: 0 8px; font-size: 12px; }
#angleDlg { width: 720px; }
.angle-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.angle-top .spacer { flex: 1; }
.angle-top .sets { display: inline-flex; gap: 8px; }
.angle-top .btn { height: 28px; padding: 0 10px; }
.angle-list { max-height: 54vh; overflow-y: auto; background: #fff; border: 1px solid var(--line); padding: 4px 12px 8px; }
.angle-group { margin: 12px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.angle-item { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; margin: 0; padding: 6px 0; border-bottom: 1px solid #eee; cursor: pointer; }
.angle-item:hover { background: var(--hover); }
.angle-item input { width: auto; margin: 2px 0 0; }
</style>
<script src="../../../hub/assets/hub.js" defer></script>
</head>
<body data-fit="980x700">
<main>
  <header><a class="btn" id="menu" href="#" hidden>← Menu</a><h1>Content MXH</h1></header>

  <div class="layout">
    <section class="group">
      <h2>Sản phẩm &amp; ảnh</h2>
      <div class="tools-row">
        <button class="btn primary" id="btnAdd" type="button" style="width:160px">+ Thêm sản phẩm</button>
        <button class="btn" id="btnClear" type="button" style="width:120px">Xóa tất cả</button>
      </div>
      <div class="listbox" id="rows"></div>
    </section>
    <section class="group actions-col">
      
      <label>Đăng lên</label>
      <div class="platforms" id="platforms" role="group" aria-label="Đăng lên"></div>
      <label>Giọng văn</label>
      <div class="seg" id="tones" role="group" aria-label="Giọng văn"></div>
      <div class="pair2"><div><label for="imageAi">Tạo ảnh</label><select id="imageAi"></select></div><div><label for="textAi">Viết bài</label><select id="textAi"></select></div></div>
      <label for="note">Lời nhắn cho AI</label>
      <textarea id="note" placeholder="Ý muốn thêm hoặc góp ý cho bài viết. Ví dụ: nhấn mạnh khoảnh khắc buổi tối, giọng gần gũi."></textarea>
    </section>
    <section class="group run">
      <button class="btn primary" id="btnRun" type="button">Bắt đầu</button>
      <button class="btn" id="btnStop" type="button" disabled>Dừng</button>
      <span class="muted" id="status"></span>
    </section>
    <section class="group" id="logGroup">
      <h2>Tiến trình &amp; thông báo</h2>
      <div class="progress" id="bar"><span></span></div>
      <div class="muted" id="progress"></div>
      <textarea id="log" readonly></textarea>
    </section>
    <section class="group" id="resultGroup">
      <h2 id="resultTitle">Kết quả</h2>
      <div id="result">
        <div class="side"><label>Ảnh tạo thành</label><div class="tiles" id="results"></div></div>
        <div class="side"><div class="post-head"><div class="seg" id="tabs" role="tablist" aria-label="Nền tảng"></div><button class="btn" id="copy" type="button">Copy bài đăng</button></div><pre class="out" id="out"></pre><div class="post-tip"><span id="tip"></span><span id="count"></span></div></div>
      </div>
    </section>
  </div>
</main>

<dialog id="dlg">
  <div class="bar"><span id="dlgTitle">Sản phẩm</span><button type="button" id="dlgX" aria-label="Đóng">✕</button></div>
  <div class="body">
    <div class="pair">
      <div><label for="name">Tên sản phẩm</label><input id="name" placeholder="Bàn trà gỗ óc chó chân vòm"><label for="link">Link sản phẩm</label><input id="link" placeholder="https://…"><label for="tags">Hashtag (cách nhau bởi dấu cách)</label><textarea id="tags" placeholder="#BanTraGo #GocTra"></textarea></div>
      <div><label for="brand">Thương hiệu</label><select id="brand"></select><input id="brandOther" hidden placeholder="Tên thương hiệu" autocomplete="off">
        <div class="wm-preview" id="wmPreview"></div><label class="check" id="wmCheck"><input type="checkbox" id="watermark"><span>Đóng dấu logo lên ảnh</span></label></div>
    </div>
    <label>Ảnh sản phẩm theo màu và ảnh cảnh</label>
    <div class="colors" id="colors"></div>
    <div class="muted small" id="dlgNote"></div>
    <input id="pick" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <div class="foot"><button class="btn primary" id="dlgSave" type="button">Lưu</button><button class="btn" id="dlgCancel" type="button">Hủy</button></div>
  </div>
</dialog>
<dialog id="imgDlg">
  <div class="bar"><span id="imgTitle"></span><button type="button" id="imgX" aria-label="Đóng">✕</button></div>
  <div class="body"><div id="imgGrid"></div><div class="foot"><button class="btn" id="imgClose" type="button">Đóng</button></div></div>
</dialog>
<dialog id="angleDlg">
  <div class="bar"><span>Chọn góc máy</span><button type="button" id="angleX" aria-label="Đóng">✕</button></div>
  <div class="body">
    <div class="angle-top"><span class="muted" id="angleSummary"></span><span class="spacer"></span><span id="angleSets" class="sets"></span><button class="btn" id="angleClear" type="button">Bỏ chọn hết</button></div>
    <div id="angleList" class="angle-list"></div>
    <div class="foot"><button class="btn primary" id="angleOk" type="button">Xong</button></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>

// src/run-content.ps1, started by src/server.mjs, which turns the run's @@EVENT lines into the events this page polls.
// The product details and the photos' paths are kept in this browser; photos live in workspace/temp/uploads.

    return row;
  });
  const add = el("div", { className: "crow-add" });
  add.append(addTile("+", () => { pickColor = -1; $("pick").click(); }), addTile("Dán", () => pasteFromClipboard(-1)), el("span", { className: "muted", textContent: "Thêm ảnh sản phẩm (mỗi ảnh một màu)" }));
  add.addEventListener("mouseenter", () => { activeColor = -1; [...$("colors").children].forEach((r) => r.setAttribute("aria-current", "false")); });
  add.addEventListener("dragover", (e) => e.preventDefault());
  add.addEventListener("drop", (e) => { e.preventDefault(); e.stopPropagation(); addFiles([...e.dataTransfer.files], -1); });
  $("colors").replaceChildren(...rows, add);
  const shots = draft.reduce((n, c) => n + scenesOf(c).reduce((m, s) => m + s.angles.length, 0), 0);
  $("dlgNote").textContent = draft.length ? `${draft.length} màu · ${shotsEstimate(shots)}` : "Chưa có ảnh sản phẩm";
  if ($("dlg").open) updateWatermarkPreview();
}
// An image goes to the color under the pointer as a scene, or becomes a new color when none is active.
async function addFiles(files, colorIndex) {
  for (const f of files) {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast(`${f.name || "Ảnh"}: chọn ảnh PNG, JPEG hoặc WebP`); continue; }
    const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name || "clipboard.png")}`, { method: "POST", body: f }).catch(() => null);
    const body = r && (await r.json().catch(() => null));
    if (!r || !r.ok || !body?.path) { toast(body?.error || `Không tải được ${f.name}`); continue; }
    const photo = { name: f.name || "clipboard.png", path: body.path };
    if (colorIndex >= 0 && draft[colorIndex]) draft[colorIndex].scenes.push({ ...photo, angles: [...(draft[colorIndex].scenes[0]?.angles || draft[colorIndex].angles)] });
    else { draft.push({ id: uid(), name: "", product: photo, scenes: [], angles: [...DATA.angleDefault] }); activeColor = draft.length - 1; }
    renderColors();
  }
}
async function pasteFromClipboard(colorIndex) {
  const files = [];
  try {
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find((t) => /^image\/(png|jpeg)$/.test(t));
      if (type) files.push(new File([await item.getType(type)], type === "image/png" ? "clipboard.png" : "clipboard.jpg", { type }));
    }
  } catch {}
  if (!files.length) return toast("Clipboard chưa có ảnh.");
  addFiles(files, colorIndex);
}
function edit(row) {
  editing = row;
  $("dlgTitle").textContent = row ? `Sản phẩm #${state.rows.indexOf(row) + 1}` : "Thêm sản phẩm";
  FIELDS.forEach((f) => { $(f).value = row ? row[f] : ""; });
  setBrand(row ? row.brand : "");
  draft = row ? row.colors.map((c) => ({ ...c, product: { ...c.product }, scenes: c.scenes.map((s) => ({ ...s, angles: [...s.angles] })), angles: [...c.angles] })) : [];
  activeColor = -1;
  renderColors();
  $("dlg").showModal();
  updateWatermarkPreview();
  $("name").focus();
}
$("dlgSave").onclick = () => {
  if (!$("name").value.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  if (!draft.length) return toast("Thêm ít nhất một ảnh sản phẩm");
  const row = editing || fresh({ id: uid(), colors: [] });
  FIELDS.forEach((f) => { row[f] = $(f).value; });
  row.brand = getBrand();
  row.colors = draft;
  if (!editing) state.rows.push(row);
  state.current = row.id;
  $("dlg").close();
  render();
  document.querySelector('.qrow[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
};
$("dlgCancel").onclick = $("dlgX").onclick = () => $("dlg").close();
$("dlg").addEventListener("cancel", (e) => { e.preventDefault(); $("dlg").close(); });
$("pick").onchange = (e) => { addFiles([...e.target.files], pickColor); e.target.value = ""; };
// Ctrl+V while the dialog is open: an image goes to the active color (or becomes a new color).
document.addEventListener("paste", (e) => {
  if (!$("dlg").open || $("angleDlg").open) return;
  const files = [...(e.clipboardData?.files || [])].filter((f) => /^image\//.test(f.type));
  if (!files.length) return;
  e.preventDefault();
  addFiles(files, draft.length && activeColor >= 0 ? Math.min(activeColor, draft.length - 1) : -1);
});
$("colors").addEventListener("dragover", (e) => e.preventDefault());
$("colors").addEventListener("drop", (e) => { e.preventDefault(); addFiles([...e.dataTransfer.files], -1); });
$("btnAdd").onclick = () => edit(null);
$("btnClear").onclick = () => {
  if (!state.rows.length || !confirm("Xóa tất cả sản phẩm?")) return;
  state.rows = []; render();
};

// ----- Chọn góc máy -----
let anglePhoto = null, angleDraft = new Set();
function renderAngles() {
  const list = $("angleList");
  list.replaceChildren(...DATA.angleGroups.flatMap((g) => {
    const items = DATA.angles.filter((a) => a.group === g.id);
    if (!items.length) return [];
    const head = el("div", { className: "angle-group", textContent: g.label });
    return [head, ...items.map((a) => {
      const row = el("label", { className: "angle-item" });
      const box = el("input", { type: "checkbox", checked: angleDraft.has(a.id) });
      box.onchange = () => { box.checked ? angleDraft.add(a.id) : angleDraft.delete(a.id); renderAngles(); };
      const text = el("span", {});
      text.append(el("span", { textContent: a.label }), el("span", { className: "muted small", textContent: ` · ${a.label_en}` }));
      if (a.hidden_side) text.append(el("span", { className: "warn small", textContent: " · ⚠ cần dữ liệu mặt sau" }));
      text.append(el("div", { className: "muted small", textContent: a.description }));
      row.append(box, text);
      return row;
    })];
  }));
  $("angleSummary").textContent = angleDraft.size ? shotsEstimate(angleDraft.size) : "Chưa chọn góc nào";
  $("angleOk").disabled = !angleDraft.size;
  $("angleSets").replaceChildren(...DATA.angleSets.map((set) => {
    const b = el("button", { type: "button", className: "btn", textContent: set.label, title: set.note });
    b.onclick = () => { angleDraft = new Set(set.angles); renderAngles(); };
    return b;
  }));
}
// With scenes the color's angles are its scenes' angles (one choice for all of them).
const anglesOf = (holder) => (holder.scenes?.length ? holder.scenes[0].angles : holder.angles);
function openAngles(photo) {
  anglePhoto = photo;
  angleDraft = new Set(anglesOf(photo));
  renderAngles();
  $("angleDlg").showModal();
}
$("angleClear").onclick = () => { angleDraft = new Set(); renderAngles(); };
$("angleOk").onclick = () => {
  anglePhoto.angles = DATA.angles.filter((a) => angleDraft.has(a.id)).map((a) => a.id);
  for (const scene of anglePhoto.scenes || []) scene.angles = [...anglePhoto.angles];
  $("angleDlg").close();
  renderColors();
};
$("angleX").onclick = () => $("angleDlg").close();
$("angleDlg").addEventListener("cancel", (e) => { e.preventDefault(); $("angleDlg").close(); });

// ----- Xem ảnh lớn: a window with Đóng, Esc or a click outside closes it -----
// items: [{ url, label, result }]; with several, the originals sit beside the result so they can be compared.
function showImages(items, title) {
  $("imgGrid").replaceChildren(...items.map((it) => {
    const fig = el("figure", { className: it.result ? "result" : "" });
    const img = el("img", { src: it.url, alt: it.label || "" });
    fig.append(img, el("figcaption", { textContent: it.label || "" }));
    return fig;
  }));
  $("imgDlg").classList.toggle("compare", items.length > 1);
  $("imgTitle").textContent = title || "";
  $("imgDlg").showModal();
  $("imgClose").focus();
}
const showImage = (url, title) => showImages([{ url, label: title }], title);
$("imgClose").onclick = $("imgX").onclick = () => $("imgDlg").close();
$("imgDlg").addEventListener("click", (e) => { if (e.target === $("imgDlg")) $("imgDlg").close(); });

// ----- Chạy -----
const rowOf = (id) => state.rows.find((r) => r.id === id);
const LOG_MAX = 500;
function logLine(text) {
  const t = new Date().toLocaleTimeString("vi-VN", { hour12: false });
  state.log.push(`${t}  ${text}`);
  if (state.log.length > LOG_MAX) state.log.splice(0, state.log.length - LOG_MAX);
}
function logEvent(e, row) {
  const name = row ? `#${state.rows.indexOf(row) + 1} ${row.name}` : "";
  if (e.kind === "start") logLine(`Bắt đầu: ${e.products} sản phẩm.`);
  else if (e.kind === "product") logLine(`[${e.index}/${state.total}] ${e.name}`);
  else if (e.kind === "image") logLine(`   Ảnh ${e.label || ""} ${e.ok ? "xong" : "lỗi: " + (e.message || "")}`);
  else if (e.kind === "post") logLine(`   Bài ${PLATFORMS[e.platform]?.name || e.platform} ${e.error ? "lỗi: " + e.error : "xong"}`);
  else if (e.kind === "warning") logLine(`   ⚠ ${e.message}`);
  else if (e.kind === "product-done") logLine(`${e.ok ? "Xong" : "Lỗi"} ${name}${e.errors?.length ? " · " + e.errors.length + " lỗi" : ""}`);
  else if (e.kind === "done") logLine(`Hoàn tất: ${e.ok} xong, ${e.failed} lỗi${e.aborted ? " (dừng giữa chừng)" : ""}.`);
  else if (e.kind === "fatal") logLine(`Lỗi: ${e.message}`);
}
function onEvent(e) {
  const row = rowOf(e.product || e.id);
  logEvent(e, row);
  if (e.kind === "start") { state.total = e.products; state.index = 0; state.summary = null; state.fatal = ""; }
  else if (e.kind === "product" && row) { Object.assign(row, fresh(row), { status: "working" }); state.index = e.index; }
  else if (e.kind === "image" && row) row.images[`${e.color}-${e.scene}-${e.angle}`] = { ok: e.ok, file: e.file, message: e.message, label: e.label };
  else if (e.kind === "post" && row) row.posts[e.platform] = { text: e.text, warnings: e.warnings || [], error: e.error || "" };
  else if (e.kind === "warning" && row) row.warnings.push(e.message);
  else if (e.kind === "product-done" && row) { row.status = e.ok ? "ok" : "failed"; row.errors = e.errors || []; }
  else if (e.kind === "done") state.summary = e;
  else if (e.kind === "fatal") state.fatal = e.message;
}
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const r = await fetch(`/api/run?since=${state.since}`).then((x) => x.json());
      r.events.forEach(onEvent);
      state.since = r.next;
      state.running = r.running;
      render();
      if (!r.running) break;
      await new Promise((done) => setTimeout(done, 1500));
    }
  } catch { state.running = false; render(); }
  polling = false;
}
$("btnRun").onclick = async () => {
  if (!state.rows.length) return toast("Thêm sản phẩm trước");
  if (!state.platforms.length) return toast("Chọn nền tảng muốn đăng ở mục Đăng lên");
  const missing = state.rows.findIndex((r) => !r.colors.length);
  if (missing >= 0) return toast(`Sản phẩm #${missing + 1} chưa có ảnh sản phẩm`);
  const shots = state.rows.reduce((n, r) => n + shotsOfRow(r), 0);
  if (shots > 12 && !confirm(`Sẽ tạo ${shots} ảnh, khoảng ${shots * MINUTES_PER_SHOT} phút và ${shots} lượt tạo ảnh của Codex. Tiếp tục?`)) return;
  const job = {
    imageBackend: state.imageAi, textBackend: state.textAi, tone: state.tone, note: state.note, platforms: state.platforms, watermark: state.watermark,
    products: state.rows.map((r) => ({
      id: r.id, name: r.name.trim(), brand: (r.brand || "").trim(), link: r.link.trim(), tags: r.tags,
      colors: r.colors.map((c) => ({ name: c.name.trim(), product: { name: c.product.name, path: c.product.path }, angles: c.angles, scenes: c.scenes.map((s) => ({ name: s.name, path: s.path, angles: s.angles })) })),
    })),
  };
  state.rows = state.rows.map((r) => Object.assign(r, fresh(r)));
  state.since = 0; state.summary = null; state.fatal = "";
  const r = await fetch("/api/run", { method: "POST", body: JSON.stringify(job) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r || !r.ok) return toast(body?.error || "Không bắt đầu được. Mở Content MXH từ Tools Hub.");
  state.log = [];
  state.running = true; state.total = job.products.length; state.index = 0; state.startedAt = Date.now(); state.shots = state.rows.reduce((n, r) => n + shotsOfRow(r), 0);
  render();
  poll();
};
$("btnStop").onclick = async () => { await fetch("/api/stop", { method: "POST" }).catch(() => {}); toast("Đang dừng…"); };
$("copy").onclick = async () => { await navigator.clipboard.writeText($("out").textContent); toast(`Đã copy bài đăng ${PLATFORMS[state.tab].name}`); };
$("note").value = state.note;
$("watermark").checked = state.watermark;
// Clicking the logo preview is the same as ticking the box.
$("wmPreview").onclick = () => { const box = $("watermark"); if (!box.disabled && $("wmPreview").classList.contains("plate")) box.click(); };
$("watermark").onchange = (e) => { state.watermark = e.target.checked; persist(); updateWatermarkPreview(); };
$("note").oninput = (e) => { state.note = e.target.value; persist(); };
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

// ----- Khởi động -----
const hubPort = new URLSearchParams(location.search).get("hub");
if (hubPort) { $("menu").href = `http://127.0.0.1:${hubPort}/`; $("menu").hidden = false; }
window.addEventListener("error", (e) => fetch("/api/client-error", { method: "POST", body: JSON.stringify({ message: e.message, stack: e.error?.stack || "" }) }).catch(() => {}));
function fillSelect(select, choices, key) {
  select.replaceChildren(...choices.map((c) => el("option", { value: c.id, textContent: c.name })));
  if (!choices.some((c) => c.id === state[key])) state[key] = choices[0]?.id || "";
  select.value = state[key];
  select.onchange = () => { state[key] = select.value; persist(); };
}
(async () => {
  try { DATA = await fetch("/api/data").then((r) => r.json()); }
  catch { toast("Không kết nối được máy chủ. Mở Content MXH từ Tools Hub."); }
  PLATFORMS = Object.fromEntries(Object.entries(DATA.platforms).map(([id, p]) => [id, { ...p, logo: LOGOS[id] }]));
  state.platforms = state.platforms.filter((p) => PLATFORMS[p]);
  if (!DATA.tones[state.tone]) state.tone = Object.keys(DATA.tones)[0] || "story";
  state.rows.forEach((r) => r.colors.forEach((c) => { c.scenes = c.scenes || []; c.angles = normalizeAngles(c.angles); c.scenes.forEach((s) => { s.angles = normalizeAngles(s.angles); }); }));
  fillSelect($("imageAi"), DATA.choices.image, "imageAi");
  fillSelect($("textAi"), DATA.choices.text, "textAi");
  $("brand").replaceChildren(...DATA.brands.map((b) => el("option", { value: b.name, textContent: b.name })), el("option", { value: OTHER, textContent: "Khác…" }));
  render();
  poll(); // a run still going (or just finished) on the server is shown again after a reload
})();
</script>
