<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Video</title>
<link rel="icon" href="../icon.svg">
<script>
  // light or dark before the first paint, the same key Basecoat uses
  (() => { try { const s = localStorage.getItem("themeMode"); if (s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark"); } catch (_) {} })();
</script>
<link rel="stylesheet" href="../../../hub/assets/ui/fonts/fonts.css">
<link rel="stylesheet" href="../../../hub/assets/ui/vendor/basecoat/basecoat.min.css">
<link rel="stylesheet" href="../../../hub/assets/ui/ui.css">
<style>
/* Grok Video on the Tools Hub kit (hub/assets/ui): only what this page adds to the kit's tokens and components. */
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; gap: 8px; }
.top img { width: 32px; height: 32px; border-radius: var(--radius-lg, 10px); }
.top h1 { margin-right: auto; padding-left: 4px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card > header { display: block; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.photo { position: relative; height: 150px; background: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius-lg, 10px); display: grid; place-content: center; text-align: center; color: var(--muted-foreground); cursor: pointer; overflow: hidden; padding: 8px; font-size: 0.8125rem; }
.photo:hover, .photo.dropping, .photo:focus-visible { border-color: var(--state-border-strong); color: var(--accent-foreground); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--muted); }
.photo .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; min-width: 0; padding: 0; z-index: 1; }
.photo b { color: var(--foreground); display: block; margin-bottom: 4px; }
#scenes { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.scene { display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px auto auto auto; gap: 6px; align-items: center; min-height: 40px; padding: 0 8px 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg, 10px); }
.scene:hover { border-color: var(--state-border); }
.scene.fixed { background: var(--muted); color: var(--muted-foreground); }
.scene .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene .btn { min-width: 30px; color: var(--foreground); }
.scene .btn:disabled { color: var(--muted-foreground); }
.addrow { display: flex; gap: 8px; margin-top: 12px; }
.addrow select { flex: 1; min-width: 0; }
.settings { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
.total { margin-bottom: 10px; }
.total b { color: var(--accent-foreground); font-weight: 400; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-lg, 10px); background: var(--muted); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; font: inherit; font-size: 0.8125rem; color: var(--muted-foreground); background: transparent; border: 1px solid transparent; border-radius: var(--radius-md, 8px); }
.seg button:not(:disabled):hover { border-color: var(--state-border); color: var(--accent-foreground); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--card); color: var(--foreground); border-color: var(--border); }
.seg button[aria-pressed="true"]:not(:disabled):hover, .seg button[aria-selected="true"]:not(:disabled):hover { border-color: var(--state-border); }
.buttons { display: flex; gap: 8px; }
.buttons .btn { flex: 1; }
.steps { max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-lg, 10px); padding: 8px; display: grid; gap: 6px; align-content: start; background: var(--card); }
.steps:empty { display: none; }
.step { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 44px; }
.step .thumb { width: 56px; height: 42px; object-fit: cover; background: var(--muted); border-radius: var(--radius-md, 8px); display: block; }
.step .msg { font-size: 0.75rem; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ok { color: var(--accent-foreground); } .bad, .warn { color: var(--destructive); }
#final video, .run-item video { width: 100%; max-height: 260px; background: #000; display: block; margin-top: 8px; border-radius: var(--radius-lg, 10px); }
.run-item video { margin: 0; max-height: 300px; }
#history { display: flex; flex-direction: column; gap: 8px; }
.run-item { border: 1px solid var(--border); border-radius: var(--radius-lg, 10px); background: var(--card); overflow: hidden; }
.run-item:hover { border-color: var(--state-border); }
.run-item .line { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 12px; }
.run-item .what { min-width: 0; }
.run-item .names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.history-bar .grow { color: var(--muted-foreground); flex-basis: 100%; }
@media (max-width: 860px) { .photos { grid-template-columns: minmax(0, 1fr); } }
</style>
<script src="../../../hub/assets/hub.js" defer></script>
<script src="../../../hub/assets/ui/vendor/basecoat/basecoat-all.min.js" defer></script>
</head>
<body data-fit="1100x760">
<main class="wrap">
  <header class="top">
    <img src="../icon.svg" alt="">
    <h1>Grok Video</h1>
    <a class="btn" data-variant="outline" id="menu" href="/" hidden>← Menu</a>
    <button type="button" class="btn" data-variant="ghost" id="themeBtn" aria-label="Đổi giao diện sáng tối">Tối</button>
  </header>

  <div class="grid-main" style="grid-template-columns: minmax(0, 1fr) 380px">
    <div class="stack">
      <section class="card">
        <header><h2>Ảnh</h2></header>
        <section class="stack">
          <div class="photos">
            <div class="photo" id="photoBox" tabindex="0"></div>
            <div class="photo" id="modelBox" tabindex="0"></div>
          </div>
          <div role="group" class="field"><label for="name">Tên sản phẩm</label><input id="name" placeholder="Kệ đĩa than gỗ óc chó dáng cong"></div>
        </section>
      </section>
      <section class="card">
        <header><h2>Cảnh</h2><p>Máy quay đi lần lượt, nối liền nhau.</p></header>
        <section>
          <div id="scenes"></div>
          <div class="addrow"><select class="select" id="addAngle"></select><button class="btn" data-variant="outline" id="add" type="button">Thêm cảnh</button></div>
        </section>
      </section>
      <section class="card">
        <section class="stack">
          <div id="total" class="total"></div>
          <div class="settings">
            <div class="field"><label>Mỗi cảnh</label><div class="seg" id="seconds"></div></div>
            <div class="field"><label>Độ phân giải</label><div class="seg" id="resolution"></div></div>
            <div class="field"><label>Tỷ lệ khung</label><div class="seg" id="aspect"></div></div>
          </div>
        </section>
      </section>
    </div>
    <div class="stack">
      <section class="card">
        <header><h2>Thao tác</h2></header>
        <section class="stack">
          <div class="buttons"><button class="btn" id="run" type="button">Tạo video</button><button class="btn" data-variant="outline" id="stop" type="button" disabled>Dừng</button><button class="btn" data-variant="outline" id="open" type="button" disabled>Mở thư mục</button></div>
          <p class="muted small">Chạy trong Chrome đã đăng nhập grok.com, qua extension Tools Hub. Mỗi cảnh: 1 ảnh Grok (~10 giây) và 1 video Grok (~1 phút).</p>
        </section>
      </section>
      <section class="card">
        <header><div class="head-row"><div class="seg" role="tablist" aria-label="Tiến độ hoặc lịch sử"><button type="button" role="tab" id="viewRun" aria-selected="true">Tiến độ</button><button type="button" role="tab" id="viewHistory" aria-selected="false">Lịch sử</button></div><span class="muted small" id="status"></span></div></header>
        <section id="runPane" class="stack">
          <div class="steps" id="steps"></div>
          <div id="final"></div>
        </section>
        <section id="historyPane" hidden>
          <div class="history-bar"><span class="grow small" id="historySummary"></span><button class="btn" data-variant="outline" data-size="sm" id="openAll" type="button">Mở thư mục kết quả</button><button class="btn" data-variant="outline" data-size="sm" id="btnCleanup" type="button">Dọn bớt…</button></div>
          <div id="history"></div>
        </section>
      </section>
    </div>
  </div>
</main>
<input type="file" id="picker" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="cleanDlg" class="dialog" aria-labelledby="cleanTitle" style="width:480px" onpointerdown="this.dataset.backdropPress = event.target === this" onclick="if (event.target === this && this.dataset.backdropPress === 'true') this.close()">
  <div>
    <header><h2 id="cleanTitle">Dọn bớt kết quả cũ</h2><p>Xóa hẳn các lần chạy cũ khỏi máy này để lấy lại chỗ.</p></header>
    <section class="stack">
      <div role="group" class="field"><label for="keepN">Giữ lại bao nhiêu lần chạy gần nhất</label><input id="keepN" type="number" min="0" value="5"></div>
      <div class="muted" id="cleanInfo"></div>
    </section>
    <footer><button class="btn" data-variant="outline" id="cleanCancel" type="button">Hủy</button><button class="btn" data-variant="destructive" id="cleanGo" type="button">Xóa</button></footer>
    <button type="button" id="cleanX" aria-label="Đóng"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</dialog>
<div id="toaster" class="toaster"></div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function toast(text, category = "info") { try { $("toaster").toast({ category, title: text }); } catch {} }
// Opened from the Tools Hub menu: a button back to it (?hub=<port>). The page is served by src/server.mjs.
const hubPort = new URLSearchParams(location.search).get("hub");
if (hubPort) { $("menu").href = `http://127.0.0.1:${hubPort}/`; $("menu").hidden = false; }
window.addEventListener("error", (e) => fetch("/api/client-error", { method: "POST", body: JSON.stringify({ message: e.message, stack: e.error?.stack || "" }) }).catch(() => {}));

// This page only collects the job and follows the run; the work is src/run-video.ps1, started by src/server.mjs, whose
// @@EVENT lines this page polls. Scenes are angles of the library (data/angles.json), in camera order.
const fileUrl = (path) => `/file?path=${encodeURIComponent(path)}`;
// v3: scene lengths suggested per angle (Tự động); a page saved before starts on the 1-minute set with them.
const KEY = "grok-video:make:v3";
let DATA = { settings: { seconds: [6, 10, 15], resolutions: ["720p"], defaultScenes: [], maxScenes: 12 }, angles: [], angleGroups: [] };
const make = Object.assign({ photo: "", model: "", name: "", scenes: null, seconds: "auto", resolution: "720p", aspect: "9:16" }, store.get(KEY, {}));
const run = { since: 0, running: false, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [] };
const persist = () => store.set(KEY, make);
const angleOf = (id) => DATA.angles.find((a) => a.id === id);

const BOXES = [["photoBox", "photo", "Ảnh sản phẩm", "Bấm, kéo ảnh vào, hoặc rê chuột vào đây rồi Ctrl+V"], ["modelBox", "model", "Người mẫu (tuỳ chọn)", "Mở đầu video bằng người mẫu giới thiệu sản phẩm. Bấm, kéo ảnh vào hoặc Ctrl+V"]];
function renderPhotos() {
  for (const [box, key, title, hint] of BOXES) {
    const node = $(box);
    node.replaceChildren();
    if (make[key]) {
      const x = el("button", { className: "btn x", type: "button", textContent: "×", title: "Bỏ ảnh" });
      x.dataset.variant = "secondary";
      x.onclick = (e) => { e.stopPropagation(); make[key] = ""; persist(); renderPhotos(); renderScenes(); };
      node.append(el("img", { src: fileUrl(make[key]), alt: title }), x);
    } else node.append(Object.assign(el("span"), { innerHTML: `<b>${title}</b>${hint}` }));
  }
}
let pickFor = "photo";
async function upload(file, key) {
  if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) return toast("Chọn ảnh PNG, JPEG hoặc WebP");
  const r = await fetch(`/api/upload?name=${encodeURIComponent(file.name || "anh.png")}`, { method: "POST", body: file }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không tải ảnh lên được");
  make[key] = body.path; persist(); renderPhotos(); renderScenes();
}
for (const [box, key] of BOXES) {
  const node = $(box);
  node.onclick = () => { pickFor = key; $("picker").value = ""; $("picker").click(); };
  node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("dropping"); });
  node.addEventListener("dragleave", () => node.classList.remove("dropping"));
  node.addEventListener("drop", (e) => { e.preventDefault(); node.classList.remove("dropping"); upload(e.dataTransfer.files[0], key); });
}
$("picker").onchange = (e) => upload(e.target.files[0], pickFor);
// Ctrl+V: into the box under the mouse or focused; elsewhere, into the product box while it is empty, else the model's.
// A screenshot comes as a file, an image copied from a page as an item.
let pasteInto = "";
for (const [box, key] of BOXES) {
  const node = $(box);
  node.addEventListener("mouseenter", () => (pasteInto = key));
  node.addEventListener("mouseleave", () => { if (document.activeElement !== node) pasteInto = ""; });
  node.addEventListener("focus", () => (pasteInto = key));
  node.addEventListener("blur", () => (pasteInto = ""));
}
document.addEventListener("paste", (e) => {
  if (e.target.closest?.("input, textarea")) return;
  const f = [...e.clipboardData.items].find((i) => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile();
  if (!f) return;
  e.preventDefault();
  upload(f, pasteInto || (make.photo ? "model" : "photo"));
});

function renderScenes() {
  const first = el("div", { className: "scene fixed" });
  first.append(el("span", { textContent: "0" }), el("span", { className: "name", textContent: make.model ? "Mở đầu: người mẫu giới thiệu (góc ảnh gốc)" : "Mở đầu: góc ảnh gốc" }));
  $("scenes").replaceChildren(first, ...make.scenes.map((id, i) => {
    const angle = angleOf(id);
    const row = el("div", { className: "scene" });
    const button = (text, title, onclick, disabled = false) => { const b = Object.assign(el("button", { className: "btn", type: "button", textContent: text, title, disabled }), { onclick }); b.dataset.variant = "ghost"; b.dataset.size = "sm"; return b; };
    const move = (to) => { const s = make.scenes; [s[i], s[to]] = [s[to], s[i]]; persist(); renderScenes(); };
    row.append(
      el("span", { textContent: i + 1 }),
      el("span", { className: "name", textContent: angle ? `${angle.label}${angle.hidden_side ? " (mặt khuất, phải đoán)" : ""}` : id, title: angle?.description || "" }),
      el("span", { className: "muted", textContent: `${secondsOf(id)}s` }),
      button("↑", "Lên", () => move(i - 1), i === 0),
      button("↓", "Xuống", () => move(i + 1), i === make.scenes.length - 1),
      button("×", "Bỏ cảnh", () => { make.scenes.splice(i, 1); persist(); renderScenes(); }),
    );
    return row;
  }));
  renderTotal();
}
function renderSettings() {
  const seg = (id, values, key, fmt) => $(id).replaceChildren(...values.map((v) => {
    const b = el("button", { type: "button", textContent: fmt(v) });
    b.setAttribute("aria-pressed", v === make[key]);
    b.onclick = () => { make[key] = v; persist(); renderSettings(); renderScenes(); };
    return b;
  }));
  seg("seconds", ["auto", ...DATA.settings.seconds], "seconds", (v) => (v === "auto" ? "Tự động" : `${v}s`));
  seg("resolution", DATA.settings.resolutions, "resolution", (v) => v);
  seg("aspect", DATA.settings.aspects, "aspect", (v) => v);
}
// A scene's length: the one chosen for all, or (Tự động) what data/video.json suggests for the angle's kind of move, as
// the run computes it (src/video.ps1 Test-VideoJob).
function secondsOf(id) {
  if (make.seconds !== "auto") return make.seconds;
  const s = DATA.settings;
  return s.secondsByAngle?.[id] ?? s.secondsByGroup?.[angleOf(id)?.group] ?? 10;
}
const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function renderTotal() {
  const n = make.scenes.length;
  const total = make.scenes.reduce((sum, id) => sum + secondsOf(id), 0);
  const images = 1 + make.scenes.filter((id) => (DATA.settings.keyframeAngles || []).includes(id)).length;
  const wait = Math.round(images * 0.5 + n * (DATA.settings.minutesPerScene || 1.5));
  $("total").replaceChildren(el("b", { textContent: `Video dự kiến ${clock(total)}` }), ` · ${n} cảnh · chờ tạo khoảng ${wait} phút (${images} ảnh + ${n} video Grok)`);
}
$("add").onclick = () => {
  if (make.scenes.length >= DATA.settings.maxScenes) return toast(`Tối đa ${DATA.settings.maxScenes} cảnh`);
  make.scenes.push($("addAngle").value); persist(); renderScenes();
  $("scenes").scrollTop = $("scenes").scrollHeight;
};
$("name").value = make.name;
$("name").oninput = (e) => { make.name = e.target.value; persist(); };

// The run, as the events say.
function onEvent(e) {
  if (e.kind === "start") { run.folder = e.folder; run.total = e.scenes; }
  else if (e.kind === "frame") run.steps[`f${e.index}`] = e;
  else if (e.kind === "clip") run.steps[`c${e.index}`] = e;
  else if (e.kind === "final") run.final = e;
  else if (e.kind === "warning") run.warnings.push(e.message);
  else if (e.kind === "done") { run.summary = e; loadRuns(); }
  else if (e.kind === "fatal") run.fatal = e.message;
}
function renderRun() {
  $("run").disabled = run.running; $("stop").disabled = !run.running; $("open").disabled = !run.folder;
  const n = run.total ?? make.scenes.length;
  const rows = [];
  const line = (key, title, frame) => {
    const e = run.steps[key];
    const row = el("div", { className: "step" });
    const thumb = e?.file && frame ? el("img", { className: "thumb", src: fileUrl(e.file) }) : el("div", { className: "thumb" });
    const text = el("div");
    const state = el("span", { className: e ? (e.ok ? "ok" : "bad") : "muted", textContent: !e ? (run.running ? "chờ" : "") : e.ok ? "xong" : "lỗi" });
    text.append(el("div", { textContent: `${title}${e?.label ? ": " + e.label : ""} ` }));
    text.firstChild.append(state);
    if (e?.message) text.append(el("div", { className: "msg", textContent: e.message, title: e.message }));
    row.append(thumb, text);
    rows.push(row);
  };
  if (run.running || run.summary || run.fatal) {
    for (let i = 0; i <= n; i++) line(`f${i}`, `Khung ${i}`, true);
    for (let i = 1; i <= n; i++) line(`c${i}`, `Video cảnh ${i}`, false);
  }
  for (const w of run.warnings) rows.push(el("div", { className: "warn small", textContent: w }));
  if (run.fatal) rows.push(el("div", { className: "bad", textContent: run.fatal }));
  if (run.summary?.message) rows.push(el("div", { className: "warn", textContent: run.summary.message }));
  $("steps").replaceChildren(...rows);
  const done = Object.values(run.steps).filter((s) => s.ok).length;
  $("status").textContent = run.running ? `đang chạy · ${done}/${2 * n + 1} bước` : run.summary ? (run.summary.ok ? "xong" : "chưa ra video") : "";
  const final = $("final");
  if (run.final && final.dataset.file !== run.final.file) {
    final.dataset.file = run.final.file;
    final.replaceChildren(el("div", { className: "ok", textContent: `Video ${run.final.seconds}s, ${run.final.width}×${run.final.height}` }), el("video", { src: fileUrl(run.final.file), controls: true, playsInline: true }));
  } else if (!run.final) { final.dataset.file = ""; final.replaceChildren(); }
}
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const r = await fetch(`/api/run?since=${run.since}`).then((x) => x.json());
      r.events.forEach(onEvent);
      run.since = r.next; run.running = r.running; run.folder = r.folder || run.folder;
      renderRun();
      if (!r.running) break;
      await new Promise((done) => setTimeout(done, 1500));
    }
  } catch { run.running = false; renderRun(); }
  polling = false;
}
$("run").onclick = async () => {
  if (!make.photo) return toast("Thêm ảnh sản phẩm");
  if (!make.name.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  if (!make.scenes.length) return toast("Thêm ít nhất một cảnh");
  const job = { product: make.name.trim(), photo: make.photo, model: make.model, scenes: make.scenes, seconds: make.seconds, resolution: make.resolution, aspect: make.aspect, audio: false };
  Object.assign(run, { since: 0, steps: {}, final: null, folder: "", summary: null, fatal: "", warnings: [], total: make.scenes.length });
  const r = await fetch("/api/run", { method: "POST", body: JSON.stringify(job) }).catch(() => null);
  const body = r && (await r.json().catch(() => ({})));
  if (!r?.ok) return toast(body?.error || "Không bắt đầu được. Mở Grok Video từ Tools Hub.");
  run.running = true; renderRun(); poll();
};
$("stop").onclick = async () => { await fetch("/api/stop", { method: "POST" }).catch(() => {}); toast("Đang dừng…"); };
$("open").onclick = () => fetch("/api/open-folder", { method: "POST" }).catch(() => {});


fetch("/api/data").then((r) => r.json()).then((data) => {
  DATA = data;
  if (!Array.isArray(make.scenes)) make.scenes = [...data.settings.defaultScenes];
  make.scenes = make.scenes.filter(angleOf);
  if (make.seconds !== "auto" && !data.settings.seconds.includes(make.seconds)) make.seconds = "auto";
  if (!data.settings.resolutions.includes(make.resolution)) make.resolution = data.settings.defaultResolution;
  if (!data.settings.aspects.includes(make.aspect)) make.aspect = data.settings.defaultAspect;
  $("addAngle").replaceChildren(...data.angleGroups.map((g) => {
    const group = el("optgroup", { label: g.label });
    group.append(...data.angles.filter((a) => a.group === g.id).map((a) => el("option", { value: a.id, textContent: a.label })));
    return group;
  }));
  renderPhotos(); renderSettings(); renderScenes(); renderRun(); poll();
}, () => toast("Không đọc được dữ liệu. Mở Grok Video từ Tools Hub."));


// ----- Tiến độ / Lịch sử -----
const MB = (bytes) => bytes >= 1024 * 1024 * 1024 ? `${(bytes / 1024 / 1024 / 1024).toFixed(1)} GB` : `${Math.max(1, Math.round(bytes / 1024 / 1024))} MB`;
const runTime = (id) => { const m = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})h(\d{2})m(\d{2})s/.exec(id); return m ? `${m[4]}:${m[5]} · ${m[3]}/${m[2]}/${m[1]}` : id; };
let RUNS = { folder: "", bytes: 0, runs: [] };
const playing = new Set();
async function openInExplorer(path) {
  const r = await fetch("/api/open", { method: "POST", body: JSON.stringify({ path }) }).catch(() => null);
  if (!r || !r.ok) toast("Không mở được thư mục.", "error");
}
function showView(view) {
  const history = view === "history";
  $("viewRun").setAttribute("aria-selected", !history); $("viewHistory").setAttribute("aria-selected", history);
  $("runPane").hidden = history; $("historyPane").hidden = !history;
  try { localStorage.setItem(KEY + ":view", view); } catch {}
  if (history) loadRuns();
}
$("viewRun").onclick = () => showView("run");
$("viewHistory").onclick = () => showView("history");
function renderHistory() {
  $("historySummary").textContent = RUNS.runs.length ? `${RUNS.runs.length} lần chạy · ${MB(RUNS.bytes)} trên máy này` : "Chưa có lần chạy nào.";
  $("btnCleanup").disabled = RUNS.runs.length === 0 || run.running;
  $("history").replaceChildren(...RUNS.runs.map((r) => {
    const item = el("div", { className: "run-item" });
    const what = el("div", { className: "what" });
    what.append(el("div", { textContent: runTime(r.id) }), el("div", { className: "muted small names", textContent: r.name }), el("div", { className: "muted small", textContent: `${r.video ? "Có video" : "Chưa ra video"} · ${r.frames} khung · ${r.clips} clip · ${MB(r.bytes)}` }));
    const actions = el("div", { className: "row" });
    const play = el("button", { type: "button", className: "btn", textContent: playing.has(r.id) ? "Ẩn video" : "Xem video", disabled: !r.video });
    const open = el("button", { type: "button", className: "btn", textContent: "Mở thư mục" });
    const del = el("button", { type: "button", className: "btn", textContent: "Xóa", disabled: r.running });
    play.dataset.variant = open.dataset.variant = "outline"; del.dataset.variant = "ghost";
    play.dataset.size = open.dataset.size = del.dataset.size = "sm";
    play.onclick = () => { playing.has(r.id) ? playing.delete(r.id) : playing.add(r.id); renderHistory(); };
    open.onclick = () => openInExplorer(r.folder);
    del.onclick = async () => { if (confirm(`Xóa hẳn lần chạy ${runTime(r.id)} (${MB(r.bytes)}) khỏi máy này?`)) await deleteRuns([r.id]); };
    actions.append(play, open, del);
    const line = el("div", { className: "line" });
    line.append(what, actions);
    item.append(line);
    if (playing.has(r.id) && r.video) item.append(el("video", { src: fileUrl(r.video), controls: true, playsInline: true }));
    return item;
  }));
}
async function loadRuns() {
  try { RUNS = await fetch("/api/runs").then((x) => x.json()); } catch { return; }
  renderHistory();
}
async function deleteRuns(ids) {
  const r = await fetch("/api/runs/delete", { method: "POST", body: JSON.stringify({ ids }) }).then((x) => x.json()).catch(() => null);
  if (!r) return toast("Không xóa được.", "error");
  toast(`Đã xóa ${r.removed.length} lần chạy${r.kept.length ? `, giữ lại ${r.kept.length}` : ""}`, r.kept.length ? "info" : "success");
  await loadRuns();
}
const toClean = () => { const keep = Math.max(0, Math.floor(Number($("keepN").value) || 0)); return RUNS.runs.slice(keep).filter((r) => !r.running); };
function renderClean() {
  const old = toClean(), bytes = old.reduce((n, r) => n + r.bytes, 0);
  $("cleanInfo").textContent = old.length ? `Sẽ xóa ${old.length} lần chạy cũ, lấy lại ${MB(bytes)}.` : "Không có lần chạy nào cần xóa.";
  $("cleanGo").disabled = !old.length;
}
$("btnCleanup").onclick = () => { renderClean(); $("cleanDlg").showModal(); };
$("keepN").oninput = renderClean;
$("cleanCancel").onclick = $("cleanX").onclick = () => $("cleanDlg").close();
$("cleanGo").onclick = async () => { const ids = toClean().map((r) => r.id); $("cleanDlg").close(); await deleteRuns(ids); };
$("openAll").onclick = () => openInExplorer("");

const themeBtn = $("themeBtn");
const themeLabel = () => { themeBtn.textContent = document.documentElement.classList.contains("dark") ? "Sáng" : "Tối"; };
themeBtn.onclick = () => { const dark = document.documentElement.classList.toggle("dark"); try { localStorage.setItem("themeMode", dark ? "dark" : "light"); } catch {} themeLabel(); };
themeLabel();
try { if (localStorage.getItem(KEY + ":view") === "history") showView("history"); } catch {}
</script>
</body>
</html>
