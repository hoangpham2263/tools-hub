<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #1f2933; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2933; --text: #f3f4f6; } }
  body { margin: 0; padding: 16px 20px; background: var(--bg); color: var(--text); font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  img { width: 28px; height: 28px; }
</style>
</head>
<body>
  <div class="brand"><img src="icons/icon.svg" alt="">Tools Hub by Hoang Pham</div>
</body>
</html>
